apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: photo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photo-service
        app: photo-service
    spec:
      containers:
        - name: photo-service
          image: docker.io/lazycomputing/photo-service
          ports:
            - containerPort: 8080
              name: service
            - containerPort: 8081
              name: management
          resources: {}
      restartPolicy: Always
