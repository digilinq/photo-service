apiVersion: v1
kind: Service
metadata:
  name: photo-service
spec:
  selector:
    app.kubernetes.io/name: photo-service
  ports:
    - name: service
      protocol: TCP
      port: 8080
      targetPort: service
    - name: management
      port: 8081
      protocol: TCP
      targetPort: management
  type: ClusterIP
