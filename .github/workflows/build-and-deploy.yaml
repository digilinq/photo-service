name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:
    inputs:
      replicas:
        description: 'Number of pods to run'
        required: false
        default: '2'
      namespace:
        description: 'Target Kubernetes namespace'
        required: false
        default: 'amohammadi'
jobs:
  build:
    name: Build maven project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify -DskipTests
      - run: mkdir staging && cp target/*.jar staging
      - run: cp ./Dockerfile staging
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
  publish:
    env:
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
    name: Create docker image and push to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Package
      - name: Login to container repository
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=ref,event=branch,suffix=-{{ sha }}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [publish, build]
    env:
      REPLICAS: ${{ github.event.inputs.replicas || '2' }}
      NAMESPACE: ${{ github.event.inputs.namespace || 'amohammadi' }}
      DOCKER_IMAGE: ${{ needs.publish.outputs.docker-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set the Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: service-account
          k8s-url: ${{ secrets.KUBERNETES_URL }}
          k8s-secret: ${{ secrets.KUBERNETES_SECRET }}
      - name: Configure Kustomize overlay
        working-directory: k8s/overlays/default
        run: |
          IMAGE="$(echo "$DOCKER_IMAGE" | head -n1)"
          kustomize edit set namespace "$NAMESPACE"
          kustomize edit set replicas photo-service="$REPLICAS"
          kustomize edit set image docker.io/lazycomputing/photo-service="$IMAGE"
      - name: Deploy to the Kubernetes cluster
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kustomize build k8s/overlays/default | kubectl apply -f -
          kubectl rollout status deployment/photo-service -n "$NAMESPACE"
