name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - '**'
jobs:
  build:
    name: Build maven project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: ls -la
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify -DskipTests
      - run: mkdir staging && cp target/*.jar staging
      - run: cp ./Dockerfile staging
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
  publish:
    env:
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}
    name: Create docker image and push to Docker Hub
    needs: build
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Package
      - name: Login to container repository
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=ref,event=branch,suffix=-{{ sha }}
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [publish, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug secret
        run: |
          echo '${{ vars.K8S_SECRET }}' > secret.yaml
          cat secret.yaml
      - name: Set the Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: service-account
          k8s-url: ${{ secrets.KUBERNETES_URL }}
          k8s-secret: ${{ vars.K8S_SECRET }}
      - name: Deploy to the Kubernetes cluster
        uses: azure/k8s-deploy@v6
        with:
          namespace: amohammadi
          manifests: |
            manifests/deployment.yml
            manifests/service.yaml
            manifests/ingress.yaml
          images: |
            ${{ needs.publish.outputs.docker-image }}
